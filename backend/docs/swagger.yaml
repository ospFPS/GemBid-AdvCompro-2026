      tags:
      - Authentication
  /api/seller/apply:
    post:
      consumes:
      - application/json
      description: Submit a seller application for the authenticated normal user.
      parameters:
      - description: Seller application
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.SellerApplyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - BearerAuth: []
