basePath: /
definitions:
  main.AuctionListItem:
    properties:
      auction_id:
        type: integer
      current_highest_bidder_id:
        type: integer
      current_price:
        type: number
      end_time:
        type: string
      gem_id:
        type: integer
      gem_name:
        type: string
      gem_type:
        type: string
      listing_id:
        type: integer
      minimum_increment:
        type: number
      start_time:
        type: string
      starting_price:
        type: number
      status:
        type: string
    type: object
  main.AuctionResponse:
    properties:
      auction_id:
        type: integer
      closed_at:
        type: string
      created_at:
        type: string
      current_highest_bidder_id:
        type: integer
      current_price:
        type: number
      end_time:
        type: string
      listing_id:
        type: integer
      minimum_increment:
        type: number
      reserve_price:
        type: number
      start_time:
        type: string
      starting_price:
        type: number
      status:
        type: string
      winner_id:
        type: integer
      winning_bid_id:
        type: integer
    type: object
  main.BidResponse:
    properties:
      auction_id:
        type: integer
      bid_amount:
        type: number
      bid_id:
        type: integer
      bid_status:
        type: string
      bid_time:
        type: string
      bidder_id:
        type: integer
    type: object
  main.CreateAuctionRequest:
    properties:
      end_time:
        type: string
      listing_id:
        type: integer
      minimum_increment:
        type: number
      reserve_price:
        type: number
      start_time:
        type: string
      starting_price:
        type: number
    type: object
  main.CreateGemRequest:
    properties:
      carat:
        type: number
      clarity:
        type: string
      color:
        type: string
      description:
        type: string
      gem_name:
        type: string
      gem_type:
        type: string
      height:
        type: number
      length:
        type: number
      origin:
        type: string
      shape:
        type: string
      treatment:
        type: string
      width:
        type: number
    type: object
  main.CreateListingRequest:
    properties:
      gem_id:
        type: integer
    type: object
  main.GemResponse:
    properties:
      carat:
        type: number
      clarity:
        type: string
      color:
        type: string
      created_at:
        type: string
      description:
        type: string
      gem_id:
        type: integer
      gem_name:
        type: string
      gem_type:
        type: string
      height:
        type: number
      length:
        type: number
      origin:
        type: string
      seller_id:
        type: integer
      shape:
        type: string
      treatment:
        type: string
      updated_at:
        type: string
      width:
        type: number
    type: object
  main.ListingListItem:
    properties:
      fixed_price:
        type: number
      gem_id:
        type: integer
      gem_name:
        type: string
      gem_type:
        type: string
      listing_id:
        type: integer
      sale_type:
        type: string
      status:
        type: string
    type: object
  main.ListingResponse:
    properties:
      created_at:
        type: string
      fixed_price:
        type: number
      gem_id:
        type: integer
      listing_id:
        type: integer
      published_at:
        type: string
      relisted_from_listing_id:
        type: integer
      sale_type:
        type: string
      seller_id:
        type: integer
      status:
        type: string
      updated_at:
        type: string
    type: object
  main.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  main.OrderDetailResponse:
    properties:
      order:
        $ref: '#/definitions/main.OrderResponse'
      shipping:
        $ref: '#/definitions/main.ShippingResponse'
      transactions:
        items:
          $ref: '#/definitions/main.TransactionResponse'
        type: array
    type: object
  main.OrderResponse:
    properties:
      auction_id:
        type: integer
      buyer_id:
        type: integer
      created_at:
        type: string
      item_price:
        type: number
      listing_id:
        type: integer
      order_id:
        type: integer
      seller_id:
        type: integer
      shipping_fee:
        type: number
      status:
        type: string
      total_amount:
        type: number
      updated_at:
        type: string
      winning_bid_id:
        type: integer
    type: object
  main.PayOrderRequest:
    properties:
      payment_method:
        example: MOCK_CARD
        type: string
      shipping_address:
        example: 123 Sukhumvit Rd, Bangkok 10110
        type: string
    type: object
  main.PlaceBidRequest:
    properties:
      bid_amount:
        type: number
    type: object
  main.PublishListingRequest:
    properties:
      fixed_price:
        type: number
      sale_type:
        description: '"FIXED_PRICE" or "AUCTION"'
        type: string
    type: object
  main.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      phone:
        type: string
    type: object
  main.SellerApplyRequest:
    properties:
      address:
        type: string
      description:
        type: string
      legal_name:
        type: string
      seller_type:
        type: string
      shop_name:
        type: string
    type: object
  main.SellerReviewRequest:
    properties:
      decision:
        type: string
    type: object
  main.ShipOrderRequest:
    properties:
      courier:
        example: Kerry Express
        type: string
      tracking_number:
        example: KEX123456789TH
        type: string
    type: object
  main.ShippingResponse:
    properties:
      courier:
        type: string
      delivered_at:
        type: string
      shipped_at:
        type: string
      shipping_address:
        type: string
      shipping_id:
        type: integer
      status:
        type: string
      tracking_number:
        type: string
      updated_at:
        type: string
    type: object
  main.SubscriptionPlan:
    properties:
      features:
        items:
          type: string
        type: array
      live_listing_limit:
        type: integer
      period_days:
        type: integer
      plan:
        type: string
      price_thb:
        type: number
    type: object
  main.TransactionResponse:
    properties:
      amount:
        type: number
      created_at:
        type: string
      order_id:
        type: integer
      paid_at:
        type: string
      payment_method:
        type: string
      reference_number:
        type: string
      status:
        type: string
      subscription_id:
        type: integer
      transaction_id:
        type: integer
    type: object
  main.UpgradeSubscriptionRequest:
    properties:
      payment_method:
        example: MOCK_CARD
        type: string
    type: object
  main.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      phone:
        type: string
      role:
        type: string
      seller_status:
        type: string
      user_id:
        type: integer
    type: object
info:
  contact: {}
  description: REST API for the GemBid gemstone marketplace and auction platform.
  title: GemBid API
  version: "1.0"
paths:
  /api/admin/analytics:
    get:
      description: 'Admin dashboard numbers: users, sellers, listings, auctions, bids,
        orders, sales (GMV), subscription revenue, email delivery and 30-day daily
        sales.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Platform analytics
      tags:
      - Admin
  /api/admin/seller-applications:
    get:
      description: Admin-only endpoint to view seller applications.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List seller applications
      tags:
      - Admin
  /api/admin/seller-applications/{id}:
    put:
      consumes:
      - application/json
      description: Admin approves or rejects a pending seller application.
      parameters:
      - description: Seller application ID
        in: path
        name: id
        required: true
        type: integer
      - description: APPROVE or REJECT
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.SellerReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Review a seller application
      tags:
      - Admin
  /api/auctions:
    get:
      description: Public endpoint returning scheduled and active auctions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.AuctionListItem'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Browse auctions
      tags:
      - Auctions
    post:
      consumes:
      - application/json
      description: Configure an AUCTION draft listing with starting price, increment,
        optional reserve price, and start/end times.
      parameters:
      - description: Auction configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.CreateAuctionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create an auction
      tags:
      - Auctions
  /api/auctions/{id}:
    get:
      description: Public endpoint returning one auction.
      parameters:
      - description: Auction ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.AuctionResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Get auction details
      tags:
      - Auctions
  /api/auctions/{id}/bids:
    get:
      description: Public endpoint returning bids for one auction, newest first.
      parameters:
      - description: Auction ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.BidResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get auction bid history
      tags:
      - Auctions
    post:
      consumes:
      - application/json
      description: Place a concurrency-safe bid on an active auction. The seller cannot
        bid on their own auction.
      parameters:
      - description: Auction ID
        in: path
        name: id
        required: true
        type: integer
      - description: Bid amount
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.PlaceBidRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Place a bid
      tags:
      - Auctions
  /api/auctions/{id}/close:
    post:
      description: Seller closes an auction after end_time (the backend also does
        this automatically every 30s). Reserve price is checked; a winner gets a PENDING_PAYMENT
        order, otherwise the listing becomes UNSOLD.
      parameters:
      - description: Auction ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Close an ended auction
      tags:
      - Auctions
  /api/gems:
    get:
      description: Return all gemstone records.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.GemResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List gemstones
      tags:
      - Gems
    post:
      consumes:
      - application/json
      description: Create a gemstone owned by the authenticated verified seller.
      parameters:
      - description: Gemstone details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.CreateGemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a gemstone
      tags:
      - Gems
  /api/gems/{id}:
    delete:
      description: Delete a gemstone owned by the authenticated verified seller if
        it is not referenced by another record.
      parameters:
      - description: Gem ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete a gemstone
      tags:
      - Gems
    get:
      description: Return one gemstone by gem_id.
      parameters:
      - description: Gem ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.GemResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get a gemstone
      tags:
      - Gems
    put:
      consumes:
      - application/json
      description: Update a gemstone owned by the authenticated verified seller.
      parameters:
      - description: Gem ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated gemstone details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.CreateGemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update a gemstone
      tags:
      - Gems
  /api/listings:
    get:
      description: Public endpoint returning PUBLISHED and ACTIVE listings.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.ListingListItem'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Browse marketplace listings
      tags:
      - Listings
    post:
      consumes:
      - application/json
      description: Create a DRAFT listing for a gemstone owned by the authenticated
        verified seller.
      parameters:
      - description: Gem to list
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.CreateListingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a draft listing
      tags:
      - Listings
  /api/listings/{id}:
    delete:
      description: Delete a seller-owned listing only while it is still DRAFT.
      parameters:
      - description: Listing ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete a draft listing
      tags:
      - Listings
    get:
      description: Return one listing by listing_id, including its current status.
      parameters:
      - description: Listing ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ListingResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Get listing details
      tags:
      - Listings
  /api/listings/{id}/buy:
    post:
      description: Buy a PUBLISHED fixed-price listing. Creates a PENDING_PAYMENT
        order and reserves the listing (SOLD).
      parameters:
      - description: Listing ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.OrderResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Buy Now
      tags:
      - Orders
  /api/listings/{id}/publish:
    put:
      consumes:
      - application/json
      description: For FIXED_PRICE, sets the price and publishes. For AUCTION, records
        AUCTION while leaving the listing DRAFT until POST /api/auctions supplies
        auction settings.
      parameters:
      - description: Listing ID
        in: path
        name: id
        required: true
        type: integer
      - description: Sale type and optional fixed price
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.PublishListingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Publish or configure a draft listing
      tags:
      - Listings
  /api/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return a JWT bearer token.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Log in
      tags:
      - Authentication
  /api/me:
    get:
      description: Return the profile of the currently authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.UserResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Authentication
  /api/notifications:
    get:
      description: Newest first, max 100. Use ?unread=true for unread only.
      parameters:
      - description: Only unread
        in: query
        name: unread
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List my notifications
      tags:
      - Notifications
  /api/notifications/{id}/read:
    put:
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Mark one notification as read
      tags:
      - Notifications
  /api/notifications/read-all:
    put:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mark all my notifications as read
      tags:
      - Notifications
  /api/orders:
    get:
      description: Orders I bought. Use ?as=seller for orders on my shop.
      parameters:
      - description: buyer (default) or seller
        in: query
        name: as
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.OrderResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List my orders
      tags:
      - Orders
  /api/orders/{id}:
    get:
      description: Order with shipping and payment transactions. Visible to the buyer,
        the seller and admins.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.OrderDetailResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get order detail
      tags:
      - Orders
  /api/orders/{id}/cancel:
    post:
      description: Buyer cancels a PENDING_PAYMENT order. A fixed-price listing goes
        back to PUBLISHED; an auction listing becomes UNSOLD.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.OrderDetailResponse'
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Cancel an unpaid order
      tags:
      - Orders
  /api/orders/{id}/confirm-delivery:
    post:
      description: Buyer confirms a SHIPPED order has arrived. Order and shipping
        become DELIVERED.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.OrderDetailResponse'
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Confirm delivery
      tags:
      - Shipping
  /api/orders/{id}/pay:
    post:
      consumes:
      - application/json
      description: Buyer pays a PENDING_PAYMENT order with MOCK_CARD or MOCK_QR and
        gives the shipping address. Order becomes PAID and a shipping record is created.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Payment method and shipping address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.PayOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.OrderDetailResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Pay for an order (mock payment)
      tags:
      - Payments
  /api/orders/{id}/ship:
    put:
      consumes:
      - application/json
      description: Seller adds courier and tracking number to a PAID order.
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: Courier and tracking number
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.ShipOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.OrderDetailResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Mark an order as shipped
      tags:
      - Shipping
  /api/register:
    post:
      consumes:
      - application/json
      description: Create a normal GemBid user account. Passwords are hashed before
        storage.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.RegisterRequest'
